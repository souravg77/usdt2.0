[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aitrader"
version = "0.1.0"
description = "AI crypto trading agent for Binance and HTX (paper-first, live locked)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "ccxt>=4.4",
  "python-dotenv>=1.0",
  "numpy>=1.26",
  "pandas>=2.1",
  "pypdf>=4.0",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
aitrader = "aitrader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.package-data]
aitrader = ["learn/library/*.json"]
