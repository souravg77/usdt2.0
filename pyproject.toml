[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aitrader"
version = "0.1.0"
description = "AI crypto trading agent for Binance and HTX (paper-first, live locked)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "ccxt>=4.4",
  "python-dotenv>=1.0",
  "numpy>=1.26",
  "pandas>=2.1",
  "pypdf>=6.21.1",  # older versions have CVE-2026-113786 and others (malformed PDFs)
  "scikit-learn>=1.4",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "cryptography>=42",
  "multidict>=6.9.1",  # via ccxt/aiohttp; older versions have PYSEC-2026-4244
  "certifi>=2026.10.19",  # HTTPS certificates; older versions have PYSEC-2026-4320
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[project.scripts]
aitrader = "aitrader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.package-data]
aitrader = ["learn/library/*.json", "web/static/*"]
