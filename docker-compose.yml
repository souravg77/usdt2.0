# aitrader services. Start the core with `docker compose up -d`; optional services have a
# profile (`docker compose --profile <name> up -d <service>`). See docs/install-ubuntu.md.
#
# Every app container runs as the unprivileged user `trader`, with a read-only filesystem
# (only ./data and /tmp are writable), no Linux capabilities, no privilege escalation and a
# memory limit. Only the `caddy` HTTPS proxy is reachable from the internet.

x-app: &app
  # Every app service runs the same image. Only `collector` builds it (`docker compose build`);
  # the others must not, or parallel builds of one tag fail with "image ... already exists".
  image: aitrader:latest
  pull_policy: never
  env_file: .env
  environment:
    AITRADER_DB_PATH: /app/data/aitrader.db
  volumes:
    - ./data:/app/data
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=256m
    - /home/trader:size=64m,uid=${AITRADER_UID:-1000},gid=${AITRADER_UID:-1000}
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  mem_limit: 1g
  pids_limit: 256
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  # Keeps candles up to date in the database. Public market data, no keys needed.
  collector:
    <<: *app
    build:
      context: .
      # download the libraries over the server's own network: on some VPSes Docker's bridge
      # network stalls large downloads (files.pythonhosted.org "Read timed out")
      network: host
      args:
        UID: ${AITRADER_UID:-1000}  # the server user's uid (id -u), so it can write ./data too
    pull_policy: missing  # build the image if it isn't there yet
    command: ["collect", "--interval", "60", "--backfill-days", "30"]

  # Market context (funding, open interest, total market cap) for the context filter and the AI
  # features. Public data, no keys needed.
  context:
    <<: *app
    command: ["context", "collect", "--interval", "900"]

  # World and crypto news: free feeds (fear & greed, trending coins, Bybit announcements,
  # headlines) plus a brief from the local AI model (ollama service): world events, regulation,
  # hacks, demand and coming coin events, as far as the feeds name them. No web search and no
  # API key; every AITRADER_NEWS_EVERY_HOURS (4).
  news:
    <<: *app
    command: ["news", "run"]
    depends_on: [ollama]

  # The local AI models: Ollama serving small open-source models, downloaded on first use into the
  # ollama_models volume: the news brief's (AITRADER_LOCAL_MODEL, qwen2.5:1.5b, about 1 GB) and the
  # night-time book reader's (AITRADER_BOOK_MODEL, qwen2.5:3b, about 2 GB; one loaded at a time).
  # Only the app containers reach it; nothing is published. It gets the CPU only when the trading
  # services don't need it (cpu_shares), and unloads a model 5 minutes after its last use to give
  # the memory back. Trader research and change requests needed Claude and are off.
  ollama:
    image: ollama/ollama:0.35.1
    environment:
      OLLAMA_KEEP_ALIVE: 5m
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cpu_shares: 256  # a quarter of the default weight: trading comes first on a busy core
    mem_limit: 3g  # the 3B book model with its 6k-token context needs about 2.5 GB
    pids_limit: 256
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Reads the books uploaded on the dashboard, at night only (AITRADER_BOOK_HOURS, local time,
  # default 0-6), with the local book model; the new strategies are backtested and the ones that
  # pass go to paper trading. Idle the rest of the day.
  books:
    <<: *app
    command: ["learn", "read-queue", "--run"]
    depends_on: [ollama]
    mem_limit: 1536m  # the backtests after a book (the model's memory is in the ollama service)

  # Paper-trades every strategy that passed `aitrader learn test`, with the calendar, market
  # context and AI filters. Never sends exchange orders.
  paper:
    <<: *app
    depends_on: [collector]
    command: ["learn", "paper", "--interval", "60"]
    mem_limit: 2g

  # Dashboard. Published on the server's localhost only: reach it through the `caddy` HTTPS
  # proxy (profile https) or an SSH tunnel. Needs AITRADER_WEB_PASSWORD in .env.
  web:
    <<: *app
    command: ["web", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      AITRADER_DB_PATH: /app/data/aitrader.db
      # Only Caddy and the server itself can reach port 8080, and Caddy overwrites
      # X-Forwarded-For, so the real client address can be trusted (login lockout per visitor).
      AITRADER_WEB_TRUST_PROXY: "true"
    ports:
      - "127.0.0.1:8080:8080"
    # book jobs (kb build, learn read) and AI filter training run inside this container. 4g is the
    # whole of a 4 GB server: a runaway job can push the host into its OOM killer (paper, collector)
    mem_limit: 4g

  # HTTPS in front of the dashboard: on your local network by IP (own certificate), or on a
  # domain (Let's Encrypt). Set AITRADER_SITE and AITRADER_TLS in .env (deploy/Caddyfile).
  #   docker compose --profile https up -d caddy
  caddy:
    image: caddy:2.11.7-alpine
    profiles: ["https"]
    depends_on: [web]
    environment:  # only these two; the app secrets in .env stay out of this container
      AITRADER_SITE: ${AITRADER_SITE:-}
      AITRADER_TLS: ${AITRADER_TLS:-internal}
      AITRADER_HOST: ${AITRADER_HOST:-localhost}  # AITRADER_SITE without https:// (the installer sets it)
    ports:  # AITRADER_HTTPS_BIND: the address to listen on (default all; the installer sets the LAN IP)
      - "${AITRADER_HTTPS_BIND:-0.0.0.0}:80:80"
      - "${AITRADER_HTTPS_BIND:-0.0.0.0}:443:443"
      - "${AITRADER_HTTPS_BIND:-0.0.0.0}:443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    mem_limit: 256m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # Telegram alerts and /status /pause /resume /kill. Needs TELEGRAM_BOT_TOKEN and
  # TELEGRAM_CHAT_ID.   docker compose --profile telegram up -d telegram
  telegram:
    <<: *app
    profiles: ["telegram"]
    command: ["telegram"]
    mem_limit: 512m

  # User accounts: trades for every approved user on their own Bybit account, only once live is
  # on for them. Needs AITRADER_KEYS_SECRET.   docker compose --profile users up -d users
  users:
    <<: *app
    profiles: ["users"]
    depends_on: [paper]
    command: ["users", "run"]

  # Phase 6 live pilot: REAL MONEY. Refuses every order unless the go/no-go gate passed, you ran
  # `golive approve`, AITRADER_PILOT_MAX_USDT is set and you opened the live lock in .env.
  # See docs/live-trading.md.   docker compose --profile live up -d executor-live
  executor-live:
    <<: *app
    profiles: ["live"]
    depends_on: [paper]
    command: ["trade", "run", "--mode", "live", "--exchange", "bybit"]
    restart: "no"

  # Claude Code, driven from the Claude app through Remote Control, in its own container: it sees
  # the code (to read and change it on a branch) and ./data read-only (logs, trades, settings), but
  # not .env, so it never sees your keys or passwords, and it can't run Docker or touch the other
  # services. Sign in once, then start it (docs/change-requests.md):
  #   docker compose --profile claude build claude
  #   docker compose --profile claude run --rm claude claude      # sign in, trust the folder, /exit
  #   docker compose --profile claude up -d claude
  claude:
    profiles: ["claude"]
    build:
      context: .
      dockerfile: deploy/claude.Dockerfile
    image: aitrader-claude:latest
    pull_policy: never
    command: ["claude", "remote-control"]
    stdin_open: true
    tty: true
    volumes:
      - ./:/work
      - /dev/null:/work/.env:ro  # the keys and passwords stay out of sight
      - ./data:/work/data:ro
      - claude_signin:/home/trader/.claude-config  # its sign-in and settings
    environment:
      DISABLE_AUTOUPDATER: "1"  # updated by rebuilding the image; its files are read-only
    read_only: true
    tmpfs:
      - /tmp:size=512m
      - /home/trader/.cache:size=256m,uid=${AITRADER_UID:-1000},gid=${AITRADER_UID:-1000}
      - /home/trader/.local/state:size=64m,uid=${AITRADER_UID:-1000},gid=${AITRADER_UID:-1000}
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 4g  # room for AI training runs; on a 4 GB server this is all of it (see web)
    pids_limit: 512
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  caddy_data:
  caddy_config:
  claude_signin:
  ollama_models:
